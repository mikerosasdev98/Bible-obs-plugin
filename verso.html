<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BibleStream Studio - OBS Overlay</title>
    <!-- Fuentes de Google Fonts -->
    <link rel="stylesheet" href="fonts/Roboto.css">
    <link rel="stylesheet" href="fonts/Montserrat.css">
    <link rel="stylesheet" href="fonts/Open_sans.css">
    <link rel="stylesheet" href="fonts/Lato.css">
    <link rel="stylesheet" href="fonts/Raleway.css">
    <link rel="stylesheet" href="fonts/Poppins.css">
    
    <link rel="stylesheet" href="css/verso.css">
</head>
<body>
    <div id="overlay-wrapper" class="theme-lower-third size-medium">
        <div id="verse-box" class="hidden">
            <div class="citation-container">
                <span class="verse-citation" id="verse-citation"></span>
                <span class="verse-version-badge" id="verse-version"></span>
            </div>
            <div class="verse-text" id="verse-text"></div>
        </div>
    </div>

    <script src="js/verso.js"></script>
</body>
</html>
