server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    
    # Servir landing.html como página principal en la raíz /
    index landing.html index.html;

    # Compresión gzip para alta velocidad
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml application/json image/svg+xml;

    # Rutas del sitio
    location / {
        try_files $uri $uri/ /landing.html;
    }

    # Caché óptima para fuentes, imágenes y scripts
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Seguridad básica en cabeceras
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
