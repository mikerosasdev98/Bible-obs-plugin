<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueSignal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Contenedor Base con esquinas redondeadas -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#bgGrad)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="2.5"/>

  <!-- Ondas de Emisión / Broadcast -->
  <path d="M 60 22 A 38 38 0 0 1 88 34" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M 60 22 A 38 38 0 0 0 32 34" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  
  <path d="M 60 29 A 28 28 0 0 1 80 39" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 60 29 A 28 28 0 0 0 40 39" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Biblia Abierta Estilizada -->
  <!-- Páginas Izquierdas -->
  <path d="M 60 88 C 45 84 32 85 24 88 C 23 88 22 87 22 85 L 22 49 C 22 47 24 46 26 46 C 35 44 48 44 60 48 Z" 
        fill="#f8fafc" opacity="0.95" />
  <path d="M 60 88 C 45 84 32 85 24 88 L 24 85 C 32 82 45 81 60 85 Z" 
        fill="#cbd5e1" />

  <!-- Páginas Derechas -->
  <path d="M 60 88 C 75 84 88 85 96 88 C 97 88 98 87 98 85 L 98 49 C 98 47 96 46 94 46 C 85 44 72 44 60 48 Z" 
        fill="#ffffff" />
  <path d="M 60 88 C 75 84 88 85 96 88 L 96 85 C 88 82 75 81 60 85 Z" 
        fill="#e2e8f0" />

  <!-- Lomo Central / Cinta Marcadora Dorada -->
  <path d="M 58 46 L 62 46 L 62 94 L 60 92 L 58 94 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Cruz moderna sutil en la página izquierda -->
  <path d="M 40 55 L 44 55 M 42 53 L 42 61" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Líneas de texto bíblico estilizadas página derecha -->
  <line x1="68" y1="56" x2="88" y2="56" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="68" y1="63" x2="88" y2="63" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="68" y1="70" x2="82" y2="70" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
</svg>
